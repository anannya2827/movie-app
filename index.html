<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vintage Film Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="archive-container">
        <header>
            <h1 class="archive-title">The Film Archive</h1>
            <p class="subtitle">Search the global open movie database</p>
        </header>

        <form id="search-form" class="search-box">
           <input type="text" id="search-input" placeholder="Search heroes & masterpieces (e.g., Spiderman, Superman, Wonder Woman)...">
            <button type="submit" id="search-btn">Search</button>
        </form>

        <div id="status-message"></div>


        <h2 id="section-title" class="section-heading">Trending Collection</h2>
        <main id="movie-grid" class="grid-container"></main>
    </div>

    <!-- MOVIE DETAILS MODAL COMPONENT -->
    <div id="movie-modal" class="modal-backdrop hidden">
        <div class="modal-content">
            <button id="close-modal" class="close-btn">&times;</button>
            <div id="modal-body">
                <!-- Injected dynamically by JavaScript -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
