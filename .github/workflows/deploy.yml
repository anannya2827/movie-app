name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Or whatever your default branch is

# ADD THIS PERMISSIONS BLOCK HERE
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # ... your build steps ...
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # The folder where your index.html, style.css, and app.js are located

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # Or @v5 as seen in your logs
